<script>
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xf1f1f1);
const camera=new THREE.PerspectiveCamera(90,1,0.1,2000);
camera.position.set(0,0,330);
const controls=new THREE.OrbitControls(camera,canvas);
controls.enableDamping=true;controls.autoRotate=true;controls.autoRotateSpeed=.6;
controls.enablePan=false;controls.minDistance=120;controls.maxDistance=600;

scene.add(new THREE.HemisphereLight(0xffffff,0x222233,0.9));
const key=new THREE.DirectionalLight(0xffffff,1.6);key.position.set(120,160,200);scene.add(key);
const rim=new THREE.DirectionalLight(0x88aaff,1.0);rim.position.set(-200,60,-150);scene.add(rim);

const mats={
  bone:new THREE.MeshStandardMaterial({color:0x2F6673,roughness:.7,metalness:1.5}),
  black:new THREE.MeshStandardMaterial({color:0x111114,roughness:.25,metalness:.4}),
  gold:new THREE.MeshStandardMaterial({color:0xd4a64a,roughness:.3,metalness:.9})
};

// ---- Effet liquide visqueux : déformation GPU autour d'une traînée de points ----
const N=24,uC=[],uVel=[],uS=new Array(N).fill(0);
for(let i=0;i<N;i++){uC.push(new THREE.Vector3());uVel.push(new THREE.Vector3());}
const liq={uC:{value:uC},uVel:{value:uVel},uS:{value:uS},uTime:{value:0}};
Object.values(mats).forEach(m=>{
  m.onBeforeCompile=sh=>{
    Object.assign(sh.uniforms,liq);
    sh.vertexShader=sh.vertexShader
      .replace('#include <common>',`#include <common>
uniform vec3 uC[${N}];uniform vec3 uVel[${N}];uniform float uS[${N}];uniform float uTime;`)
      .replace('#include <beginnormal_vertex>',`#include <beginnormal_vertex>
vec3 liqD=vec3(0.);vec3 liqG=vec3(0.);
for(int i=0;i<${N};i++){
  float s=uS[i];if(s<0.002)continue;
  vec3 d=position-uC[i];float r2=dot(d,d);float r=sqrt(r2)+1e-4;
  float g=exp(-r2/800.);
  float ph=r*0.3-uTime*4.+float(i)*0.7;
  float f=1.+0.35*sin(ph);
  liqD+=objectNormal*(s*g*f*0.2)+uVel[i]*(s*g*0.3);
  liqG+=s*(g*(-d/400.)*f+g*0.1*cos(ph)*d/r);
}
objectNormal=normalize(objectNormal-2.2*(liqG-objectNormal*dot(objectNormal,liqG)));`)
      .replace('#include <begin_vertex>','#include <begin_vertex>\ntransformed+=liqD;');
  };
});
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),plane=new THREE.Plane(),hit=new THREE.Vector3(),camDir=new THREE.Vector3();
let head=0,last=null;
canvas.addEventListener('pointermove',e=>{
  const r=canvas.getBoundingClientRect();
  ndc.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  camera.getWorldDirection(camDir);
  plane.setFromNormalAndCoplanarPoint(camDir,new THREE.Vector3());
  ray.setFromCamera(ndc,camera);
  if(!ray.ray.intersectPlane(plane,hit))return;
  const p=group.worldToLocal(hit.clone());
  if(last&&p.distanceTo(last)<2)return;
  const v=last?p.clone().sub(last):new THREE.Vector3();
  if(v.length()>10)v.setLength(10);
  head=(head+1)%N;uC[head].copy(p);uVel[head].copy(v);uS[head]=1;last=p;
});
canvas.addEventListener('pointerleave',()=>{last=null;});
const clock=new THREE.Clock();

const svgText=document.getElementById('svgsrc').textContent;
const data=new THREE.SVGLoader().parse(svgText);
const group=new THREE.Group();
const DEPTH=5;
data.paths.forEach(p=>{
  THREE.SVGLoader.createShapes(p).forEach(shape=>{
    try{
      const g=new THREE.ExtrudeGeometry(shape,{depth:DEPTH,bevelEnabled:true,bevelThickness:0.6,bevelSize:0.4,bevelOffset:-0.8,bevelSegments:2,curveSegments:8});
      g.clearGroups();
      const gt=new THREE.TessellateModifier(2,10).modify(g);
      group.add(new THREE.Mesh(gt,mats.bone));
    }catch(e){}
  });
});
// l'axe Y du SVG est inversé, puis on centre le modèle
group.scale.y=-1;
const box=new THREE.Box3().setFromObject(group);
const c=box.getCenter(new THREE.Vector3());
group.position.set(-c.x,-c.y,-c.z);
const pivot=new THREE.Group();pivot.add(group);scene.add(pivot);

function setMat(name){
  group.traverse(o=>{if(o.isMesh)o.material=mats[name];});
  document.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m===name));
}
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>setMat(b.dataset.m));
const rot=document.getElementById('rot');
rot.onclick=()=>{controls.autoRotate=!controls.autoRotate;rot.classList.toggle('on',controls.autoRotate);};

function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h,false);camera.aspect=w/h;
  camera.position.z=Math.max(camera.position.z,w/h<0.8?420:330);
  camera.updateProjectionMatrix();
}
addEventListener('resize',resize);resize();
(function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),0.05),k=Math.pow(0.35,dt);
  for(let i=0;i<N;i++){uS[i]*=k;if(uS[i]<0.002)uS[i]=0;}
  liq.uTime.value=clock.elapsedTime;
  controls.update();renderer.render(scene,camera);
})();
</script>
